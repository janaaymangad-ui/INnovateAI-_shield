<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INnovateAI Shield</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🛡️ INnovateAI Shield</h1>

        <p class="subtitle">
            Verify. Understand. Share.
        </p>

        <label>Paste the announcement</label>

        <textarea
            id="announcement"
            placeholder="Paste the announcement here..."
        ></textarea>

        <label>Announcement link <span>(optional)</span></label>

        <input
            type="text"
            id="link"
            placeholder="https://example.com"
        >

        <button onclick="analyzeAnnouncement()">
            🔍 Analyze Announcement
        </button>

        <div id="result"></div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
